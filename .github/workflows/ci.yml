name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rms/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: third_party/UnifiedModel/go.sum
      - name: Prepare Connector environment
        run: |
          python -m venv connector/.venv
          connector/.venv/bin/python -m pip install --upgrade pip
          connector/.venv/bin/python -m pip install 'hatchling==1.33.0'
          connector/.venv/bin/python -m pip install -e './connector[dev,mysql]'
      - name: Prepare ephemeral integration secrets
        run: cp rms/.env.example rms/.env
      - name: Run local-equivalent CI gate
        run: integration/scripts/ci-local.sh
