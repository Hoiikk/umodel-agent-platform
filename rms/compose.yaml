services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      RMS_DB_USER: ${RMS_DB_USER:?set in .env}
      RMS_DB_PASSWORD: ${RMS_DB_PASSWORD:?set in .env}
      RMS_READONLY_USER: ${RMS_READONLY_USER:?set in .env}
      RMS_READONLY_PASSWORD: ${RMS_READONLY_PASSWORD:?set in .env}
    ports: ["127.0.0.1:${MYSQL_PORT:-3307}:3306"]
    volumes:
      - rms_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  rms_mysql_data:
