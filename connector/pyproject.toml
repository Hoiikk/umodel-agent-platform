[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "umodel-assistant"
version = "0.3.0"
description = "Model-guided, policy-enforced enterprise data retrieval for UModel agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2,<1"]
dev = [
  "build>=1.2,<2",
  "fastapi>=0.115,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
umodel-assistant = "umodel_assistant.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umodel_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"model" = "umodel_assistant/model"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
