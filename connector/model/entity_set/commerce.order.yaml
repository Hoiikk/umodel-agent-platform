kind: entity_set
schema:
  url: "umodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "commerce.order"
  domain: commerce
  display_name:
    en_us: "Order"
    zh_cn: "订单"
  description:
    en_us: "A commerce order belonging to a user."
    zh_cn: "归属某个用户的订单。"
spec:
  fields:
    - name: order_id
      type: string
      display_name:
        en_us: "Order ID"
        zh_cn: "订单 ID"
      description:
        en_us: "Stable order identifier."
        zh_cn: "稳定订单标识。"
      example: "O-2001"
    - name: user_id
      type: string
      display_name:
        en_us: "User ID"
        zh_cn: "用户 ID"
      description:
        en_us: "Owning user identifier."
        zh_cn: "所属用户标识。"
      example: "U-1001"
    - name: amount
      type: string
      display_name:
        en_us: "Amount"
        zh_cn: "金额"
      description:
        en_us: "Order amount."
        zh_cn: "订单金额。"
      example: "128.00"
    - name: status
      type: string
      display_name:
        en_us: "Status"
        zh_cn: "状态"
      description:
        en_us: "Order status."
        zh_cn: "订单状态。"
      example: "open"
  primary_key_fields:
    - order_id
  id_generator: "order_id"
  name_fields:
    - order_id
    - status
  ordered_fields:
    - order_id
    - user_id
    - amount
    - status
  first_observed_time_field: "__first_observed_time__"
  last_observed_time_field: "__last_observed_time__"
