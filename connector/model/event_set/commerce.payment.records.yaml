kind: event_set
schema:
  url: "umodel.aliyun.com"
  version: "v1.0.0"
metadata:
  name: "commerce.payment.records"
  domain: commerce
  display_name:
    en_us: "Payment Records"
    zh_cn: "支付记录"
  description:
    en_us: "Payment rows fetched live from the payment REST API."
    zh_cn: "从支付 REST API 现场读取的支付行。"
spec:
  fields:
    - name: payment_id
      type: string
      display_name:
        en_us: "Payment ID"
        zh_cn: "支付 ID"
    - name: order_id
      type: string
      display_name:
        en_us: "Order ID"
        zh_cn: "订单 ID"
    - name: amount
      type: string
      display_name:
        en_us: "Amount"
        zh_cn: "金额"
    - name: status
      type: string
      display_name:
        en_us: "Status"
        zh_cn: "状态"
    - name: channel
      type: string
      display_name:
        en_us: "Channel"
        zh_cn: "渠道"
  name_fields:
    - payment_id
    - status
  tag_fields:
    - order_id
    - status
    - channel
  ordered_fields:
    - payment_id
    - order_id
    - amount
    - status
    - channel
  default_order: desc
  entity_fields:
    entity_id: payment_id
    domain: domain
    entity_type: entity_type
